# Report Seal — as its own stack beside Infinity's live and staging ones.
#
#   docker compose -p report-seal up -d --build      (from this worktree)
#
# Reached at http://localhost:3123 — bound to 127.0.0.1 like every other port
# in this deployment, so the only way in from outside is a tunnel, if one is
# ever pointed at it. Its own project name and image, so `up`/`down` here can
# never touch the Infinity containers; the branch is checked out in its own
# worktree (X:\Stellar-Infinity-report-seal), so what it builds is report-seal
# and nothing on main.
#
# The sealed files and the QR signing secret live in the named volume. Losing
# the volume invalidates every QR already printed — back it up before any
# `down -v`. PUBLIC_BASE_URL is the origin baked into every QR; localhost is
# right only while this is a desk instance. Point it at the public hostname
# before a sealed report leaves the building.
name: report-seal

services:
  seal:
    build: .
    image: report-seal
    # The sealing page's sign-in (SEAL_USER / SEAL_PASSWORD) lives in .env,
    # gitignored, beside this file. With SEAL_PASSWORD unset the page is open —
    # right for a desk instance, wrong behind a public hostname.
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
      # No PUBLIC_BASE_URL on purpose: the origin baked into every QR is taken
      # from each sealing request's own Host and X-Forwarded-Proto, which is
      # whatever hostname the quick tunnel below was given. Set it only once
      # this portal has a domain of its own (see the tunnel service).
      MAX_UPLOAD_MB: "25"
    volumes:
      - report-seal-data:/app/data
    ports:
      - "127.0.0.1:3123:8080"
    restart: unless-stopped

  # ---------------------------------------------------------------- tunnel --
  # A Cloudflare QUICK tunnel: a random *.trycloudflare.com hostname, free,
  # HTTPS, and carrying no Noble / Qugen / Genomics name - this portal is kept
  # apart from that branding on purpose. The hostname is printed in this
  # container's log at start:  docker compose -p report-seal logs tunnel
  #
  # The trade, stated plainly: a quick tunnel's hostname is assigned when the
  # tunnel starts and is NOT kept. If this container restarts - a reboot, an
  # image update - the portal moves to a new random hostname, and every QR
  # printed under the old one stops resolving. Good enough while the portal is
  # being tried out; before sealed reports go to patients in numbers, give it
  # a domain of its own (any cheap registrable one, added to the Cloudflare
  # account and routed through the named tunnel) and set PUBLIC_BASE_URL.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://seal:8080
    depends_on:
      - seal
    restart: unless-stopped

volumes:
  report-seal-data:
