# Stellar Infinity — the whole product, one stack.
#
#   docker compose up -d --build
#
# Previously this was two Compose projects: `stellarinfinity` for the public
# marketing splash and `infinity` for the platform. One product should be one
# stack, so they are merged here. The project name is pinned below rather than
# taken from the directory, so the stack keeps its identity regardless of where
# the repo is checked out.
#
# Ports, both bound to localhost and reached from outside only through the host
# cloudflared tunnel:
#   3120  splash    -> local only since 2026-08-23; infinity.genomicslab.in now serves the platform (3121)
#   3121  web       -> the platform SPA
#
# The API and Redis are deliberately NOT published. The API holds the Noble
# credentials and is reachable only through the SPA's nginx; Redis holds session
# state and is reachable only by the API.

name: infinity

services:
  # ---------------------------------------------------------------- splash --
  # The public marketing page. Kept as its own service rather than folded into
  # the SPA: it is already live on a public hostname, it has no API dependency,
  # and it must keep serving even while the platform is being rebuilt.
  splash:
    build: .
    image: infinity-splash
    ports:
      - "127.0.0.1:3120:80"
    # It proxies three paths through to the SPA — /r/, /assets/ and the
    # token-gated /api/public/ — because this is the only service published on
    # infinity.genomicslab.in and the QR on a printed report has to resolve to
    # a public URL. See nginx.conf.
    #
    # Still NO depends_on, and that is the point. This page must keep serving
    # while the platform is rebuilt, so it must not be ordered behind web or
    # fail with it; nginx resolves the SPA per request rather than at startup,
    # which turns "the SPA is down" into a 502 on /r/ instead of a marketing
    # page that will not boot.
    restart: unless-stopped

  # ----------------------------------------------------------------- redis --
  # Shared cache, rate-limit counters and session-version store.
  #
  # Persistence is deliberately off — every key is a cache or a short-lived
  # counter that rebuilds from Noble, so an empty Redis after a restart costs
  # one slow request, not correctness. maxmemory-policy evicts the oldest keys
  # rather than refusing writes, which would silently degrade rate limiting to
  # per-instance.
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------- api --
  api:
    build: ./api
    image: infinity-api
    # Layered, and the ORDER matters: later files win. The shared file holds
    # what both stacks agree on (database, JWT); the second holds the CCAvenue
    # triple, which CCAvenue issues per registered URL and which therefore
    # cannot be shared. Both sets briefly lived in api/.env, where the last
    # binding silently won for both stacks - staging ended up signing with the
    # live URL credentials, which the gateway rejects as a bad merchant and
    # which reads like an outage rather than a misconfiguration.
    env_file:
      - ./api/.env
      - ./api/.env.live
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Cache__ConnectionString: "redis:6379"
      # Flip to true when running more than one API container. Startup then
      # fails if Redis is missing, instead of silently reverting to
      # per-instance rate limits and stale token revocation.
      Cache__RequireDistributed: "false"

      # Where the QR on a printed report resolves.
      #
      # UNSET until now, which meant ReportLink.Enabled was false and NO QR was
      # drawn on any live report — the token secret was configured, the base
      # URL was not, and the failure is silent by design (a report without a QR
      # is still a report). Staging has always had one.
      #
      # This hostname is the marketing splash; the patient's report page lives
      # on the SPA, and the splash proxies /r/ through to it. See nginx.conf.
      #
      # NOT a secret. The secret is Reports__TokenSecret in api/.env, and with
      # it unset no QR is drawn and the public route rejects everything.
      Reports__PublicBaseUrl: "https://infinity.genomicslab.in"

      # ---- session cookie ----
      # The JWT is delivered as an httpOnly cookie, so script cannot read it
      # and an XSS defect cannot exfiltrate a session.
      #
      # TRUE since the day infinity.genomicslab.in started pointing at this
      # stack: Cloudflare terminates TLS in front of it, so the browser's
      # origin is https and a Secure cookie is accepted — and never sent over
      # a plain-http channel. The cost is that logging in at the raw
      # http://127.0.0.1:3121 no longer works (the browser discards the
      # cookie); use the public hostname, which is the address now.
      AuthCookie__Secure: "true"
      # No cross-site flow needs to arrive already authenticated here — no
      # OAuth callback, no third-party embed — so the strictest setting costs
      # nothing and blocks the classic CSRF shapes outright.
      AuthCookie__SameSite: "Strict"
    # Synapse OTA artifacts, served by /api/updates/synapse behind the fleet
    # key. Shared with staging: one host directory, whichever stack answers.
    volumes:
      - ./updates:/updates:ro
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  # ---------------------------------------------------------------- render --
  # Turns the SPA's own print routes into PDFs (headless Chromium), composites
  # the Noble letterhead and staples LIS graph attachments.
  #
  # Its own service rather than code inside the API: the API is .NET and cannot
  # drive a browser, and bundling Chromium into that image would put a 300MB
  # browser and its patch cadence into the process that holds the Noble
  # credentials. Deliberately NOT published — it renders whatever URL it is
  # given with whatever cookie it is handed, so it must stay reachable only
  # from the API. It talks back to `web` for the print route, which is why it
  # does not depend on it: nginx is up long before a PDF is ever requested, and
  # a hard dependency would just couple two restarts together.
  render:
    build: ./render
    image: infinity-render
    environment:
      RENDER_BASE_URL: http://web
      # Pages open at once inside one merged batch.
      RENDER_CONCURRENCY: "3"
    expose:
      - "8090"
    restart: unless-stopped

  # ------------------------------------------------------------------- web --
  web:
    build: ./web
    image: infinity-web
    ports:
      - "127.0.0.1:3121:80"
    depends_on:
      - api
    restart: unless-stopped
