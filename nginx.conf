server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location ~ /\. {
        deny all;
    }

    # ---- the patient's own report -------------------------------------------
    #
    # This is the marketing splash, and it is the ONLY thing published on
    # infinity.genomicslab.in. The QR printed on a report has to resolve to a
    # public URL, and the page it opens is served by the platform SPA — which is
    # deliberately not published at all.
    #
    # So the three paths that page needs are proxied through to it, and nothing
    # else is. The alternative was a path rule in the cloudflared tunnel, which
    # would put this arrangement in a file outside the repo, where nobody
    # reviewing the report code would ever find it.
    #
    # WHAT IS DELIBERATELY *NOT* HERE: /api/. Proxying the whole API would
    # publish every authenticated endpoint on a public hostname to save writing
    # three location blocks. Only /api/public/reports/* is exposed, which is
    # token-gated by design (see PublicReportEndpoints) and is the entire
    # surface the patient's page touches.
    #
    # No path collision with the splash: it links css/, js/ and branding/
    # relatively, and the SPA's bundle lives under an absolute /assets/.
    #
    # ── WHY THE UPSTREAM IS A VARIABLE ───────────────────────────────────────
    # `proxy_pass http://web` resolves its host ONCE, at startup, and nginx
    # refuses to start when it cannot. That would make this container fail to
    # boot whenever the SPA happens to be down — taking the public marketing
    # page down with it, which is the one thing this service exists to avoid
    # (see the note on the splash service in docker-compose.yml).
    #
    # Going through a variable defers resolution to request time via Docker's
    # embedded DNS, so a stopped SPA costs a 502 on /r/ and nothing else. The
    # URI must then be appended by hand: with a variable, nginx no longer
    # passes it on for you.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $spa http://web;

    location /r/ {
        proxy_pass         $spa$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The SPA's bundle, for the page above. Without it /r/ is a blank page.
    location /assets/ {
        proxy_pass         $spa$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Token-gated only: a patient fetching their own report, and its PDF.
    location /api/public/ {
        proxy_pass         $spa$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Rendering that PDF runs a headless browser; do not cut it off early.
        proxy_read_timeout 120s;
    }

    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
