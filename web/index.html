<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinity — Laboratory Command Centre</title>
    <!--
      Theme, applied before first paint.

      This MUST stay inline and synchronous, above the stylesheet. If the theme
      were applied from React instead, the page would paint light and then snap
      to dark on hydration — the flash-of-wrong-theme. Telo gets this for free
      from next-themes' injected script; here it is explicit.

      The default follows the lab's clock — 7am-7pm IST light, night dark —
      unless a habit has pinned a mode or a recent toggle is holding until the
      next boundary. Mirrors theme.ts, which owns the full story; this copy
      exists only so the FIRST paint lands on the right side.
    -->
    <script>
      (function () {
        try {
          var dark;
          var mode = localStorage.getItem('infinity-theme-mode');
          if (mode === 'dark' || mode === 'light') {
            dark = mode === 'dark';
          } else {
            var hold = null;
            try { hold = JSON.parse(localStorage.getItem('infinity-theme-hold') || 'null'); } catch (e2) {}
            if (hold && typeof hold.until === 'number' && hold.until > Date.now()
                && (hold.theme === 'dark' || hold.theme === 'light')) {
              dark = hold.theme === 'dark';
            } else {
              var d = new Date();
              var ist = (d.getUTCHours() * 60 + d.getUTCMinutes() + 330) % 1440;
              dark = !(ist >= 420 && ist < 1140);
            }
          }
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage blocked — the clockless light default is already correct */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
