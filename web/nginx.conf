server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API is reached over the compose network, so the browser only ever
    # talks to this origin — no CORS, and the API is never published directly.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Login can wait on a slow Noble; don't cut it off early.
        proxy_read_timeout 120s;
    }

    # Uptime probe. The API's health endpoint lives at /health, NOT under /api,
    # so the `location /api/` block above cannot reach it — a monitor pointed at
    # /api/health gets an empty 404 from the API and reads it as "up".
    #
    # Exact match (`location =`) so this can never shadow an SPA route: a future
    # page at /health-something still falls through to index.html.
    #
    # Safe to expose. The endpoint deliberately returns {"ok":false,"db":"down"}
    # with no exception detail — the reason goes to the API log, not to the
    # caller — so it cannot be used to fingerprint the database. It is also
    # AllowAnonymous by design, and this listener is bound to 127.0.0.1 anyway.
    location = /health {
        proxy_pass         http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Short: a probe that hangs for two minutes is not a useful probe. The
        # API caps its own DB ping at 5s.
        proxy_read_timeout 10s;
        # A probe hit every few seconds would otherwise dominate the access log.
        access_log off;
    }

    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The HTML shells must revalidate on every load. With no Cache-Control,
    # Chromium's heuristic freshness applied — and the render service keeps ONE
    # long-lived browser, so a previously-visited print URL kept serving the
    # shell (and through it the hashed bundle) from the deploy it was FIRST
    # rendered under: a complete-report download came out with a weeks-old
    # layout minutes after a redeploy. no-cache means "revalidate", not "don't
    # store" — an unchanged shell still answers 304.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /print.html { add_header Cache-Control "no-cache"; }

    # The print routes load a SEPARATE, minimal bundle (web/src/print.tsx) so the
    # render service and the preview iframe boot only the report, not the whole
    # application. A /print/* deep link that is not a real file serves print.html,
    # exactly as the SPA fallback below serves index.html for everything else.
    location /print/ {
        try_files $uri /print.html;
    }

    # SPA history fallback — deep links must serve index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
