server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API is reached over the compose network, so the browser only ever
    # talks to this origin — no CORS, and the API is never published directly.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Login can wait on a slow Noble; don't cut it off early.
        proxy_read_timeout 120s;
    }

    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA history fallback — deep links must serve index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
