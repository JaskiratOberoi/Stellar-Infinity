<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worksheet filters preview (dev harness)</title>
    <script>
      window.__errs = [];
      window.addEventListener('error', (e) => window.__errs.push(String((e.error && e.error.stack) || e.message)));
      window.addEventListener('unhandledrejection', (e) => window.__errs.push('reject: ' + String(e.reason)));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ws-preview.tsx"></script>
  </body>
</html>
