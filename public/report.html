<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Your report</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="pub">
<main class="pub__wrap">
  <section class="card pub__card">
    <p class="eyebrow">Report download</p>
    <h1 class="pub__title">Your report</h1>
    <p class="muted">Reference <b id="rid" class="mono"></b></p>
    <div id="alert" class="alert" role="alert" hidden></div>
    <button id="dl" class="btn btn--primary btn--lg" type="button">Download report (PDF)</button>
    <p id="done" class="muted small" hidden>Saved to your downloads. Keep it for your records.</p>
    <p class="pub__note">This document is confidential and intended for the person named on it. A value outside a reference range is not by itself a diagnosis; please discuss the results with your doctor.</p>
  </section>
</main>
<script src="/report.js"></script>
</body>
</html>
